# Render 無料枠は約15分アイドルでスリープするため、10分おきにヘルスチェックを叩く
name: Keep Render alive

on:
  schedule:
    # 毎時 0,10,20,30,40,50 分（UTC）。営業時間は JST 7〜21 時付近をカバー
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 120 "https://shabon-inventory.onrender.com/api/health"
