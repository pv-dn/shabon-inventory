# 一時停止したしゃぼん玉用 Supabase を手動で起こす
# アプリの「再開する」から Actions 画面を開き、Run workflow を押す
name: Resume Supabase

on:
  workflow_dispatch:

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Restore paused project
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN"
            echo "Create at https://supabase.com/dashboard/account/tokens"
            echo "Add as GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          HOST="${SUPABASE_URL#https://}"
          HOST="${HOST%%/*}"
          REF="${HOST%%.*}"
          PING_URL="${SUPABASE_URL%/}/rest/v1/products?select=id&limit=1"

          ping_ok() {
            curl -fsS --max-time 60 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Prefer: count=exact" \
              "$PING_URL" >/dev/null
          }

          if ping_ok; then
            echo "Already awake — nothing to do"
            exit 0
          fi

          echo "Restoring project $REF ..."
          curl -fsS --max-time 60 \
            -X POST "https://api.supabase.com/v1/projects/${REF}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n" || true

          for i in $(seq 1 24); do
            sleep 15
            echo "Waiting... $i/24"
            if ping_ok; then
              echo "Resume complete"
              exit 0
            fi
          done

          echo "Timed out waiting for project"
          exit 1
