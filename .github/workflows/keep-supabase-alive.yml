# しゃぼん玉在庫専用: Supabase 無料枠の一時停止を防ぐ／止まったら自動再開
# 他アプリのプロジェクトには触れない
name: Keep Supabase awake

on:
  schedule:
    # 毎日 12:00 UTC（日本時間 21:00）— 無料枠の7日停止より短く触る
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping (and restore if paused)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secrets"
            exit 1
          fi

          HOST="${SUPABASE_URL#https://}"
          HOST="${HOST%%/*}"
          REF="${HOST%%.*}"
          PING_URL="${SUPABASE_URL%/}/rest/v1/products?select=id&limit=1"

          ping_ok() {
            curl -fsS --max-time 60 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Prefer: count=exact" \
              "$PING_URL" >/dev/null
          }

          echo "Pinging $PING_URL"
          if ping_ok; then
            echo "OK (already awake)"
            exit 0
          fi

          echo "Ping failed — project may be paused"

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set."
            echo "Add it in repo Secrets (Supabase Account → Access Tokens),"
            echo "then re-run this workflow or resume from the dashboard."
            exit 1
          fi

          echo "Requesting restore for project ref: $REF"
          code=$(curl -sS -o /tmp/restore-body.txt -w "%{http_code}" --max-time 60 \
            -X POST "https://api.supabase.com/v1/projects/${REF}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" || true)
          echo "Restore HTTP $code"
          cat /tmp/restore-body.txt || true
          echo

          # 200 = restored, 4xx may mean already active — either way wait and re-ping
          echo "Waiting for project to come up..."
          for i in $(seq 1 18); do
            sleep 15
            echo "Retry ping $i/18..."
            if ping_ok; then
              echo "OK (restored / awake)"
              exit 0
            fi
          done

          echo "Still unreachable after restore attempts"
          exit 1
