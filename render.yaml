# Render.com - PC不要・固定URL（無料枠）
# DATABASE_URL は Neon（無料DB）で作成して Render に登録

services:
  - type: web
    name: shabon-inventory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && (npm ci || npm install) && npm run build
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RENDER
        value: "true"
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
