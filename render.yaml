# Render.com デプロイ設定
# https://render.com で New > Blueprint からこのファイルを指定

services:
  - type: web
    name: shabon-inventory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RENDER
        value: "true"
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shabon-inventory-db
          property: connectionString

databases:
  - name: shabon-inventory-db
    plan: basic
    databaseName: shabon_inventory
    user: shabon
