# Render.com - 旧デプロイ用（新規は Fly.io を使う）
# 参照のみ。本番は fly.toml + Neon。

services:
  - type: web
    name: shabon-inventory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && (npm ci || npm install) && npm run build
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RENDER
        value: "true"
      - key: APP_PASSWORD
        value: "haizi814"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shabon-inventory-db
          property: connectionString

databases:
  - name: shabon-inventory-db
    plan: free
