<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - しゃぼん玉在庫管理</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap {
      max-width: 360px;
      margin: 4rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(26, 35, 50, 0.1);
    }
    .login-wrap h1 { font-size: 1.2rem; margin: 0 0 1rem; }
    .login-wrap label { display: block; margin-bottom: 1rem; }
    .login-wrap input { width: 100%; padding: 0.6rem; margin-top: 0.35rem; }
    .error { color: #9b2226; font-size: 0.9rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <h1>しゃぼん玉せっけん 在庫管理</h1>
    <p>パスワードを入力してください</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>
        パスワード
        <input type="password" name="password" required autofocus>
      </label>
      <button type="submit" class="btn primary" style="width:100%">ログイン</button>
    </form>
  </div>
</body>
</html>
